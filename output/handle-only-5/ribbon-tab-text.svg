<svg xmlns="http://www.w3.org/2000/svg" width="300" height="556" viewBox="0 0 600 1112" fill="none">
  <title>리본 탭형 양방향 핸들</title>
  <desc>위로 밀어서 넘기기, 아래로 당겨서 지원. 투명 배경의 편집 가능한 벡터 시안.</desc>
  <defs>
    <linearGradient id="upper-surface" x1="94" y1="40" x2="460" y2="542" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FBFD"/>
      <stop offset="0.54" stop-color="#F0F4F9"/>
      <stop offset="1" stop-color="#E9EFF6"/>
    </linearGradient>
    <linearGradient id="lower-surface" x1="96" y1="522" x2="488" y2="1020" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF536F"/>
      <stop offset="0.55" stop-color="#FF5872"/>
      <stop offset="1" stop-color="#FF4E6A"/>
    </linearGradient>
    <linearGradient id="grip-surface" x1="300" y1="472" x2="300" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#FCFDFE"/>
      <stop offset="1" stop-color="#EDF1F6"/>
    </linearGradient>
  </defs>
  <g id="handle-shadow" fill="#20324D">
    <path opacity="0.025" transform="translate(0 12)" d="M112 40H488C523.346 40 552 68.654 552 104V842C552 974 474 1052 354 1052H246C126 1052 48 974 48 842V104C48 68.654 76.654 40 112 40Z"/>
    <path opacity="0.035" transform="translate(0 6)" d="M112 40H488C523.346 40 552 68.654 552 104V842C552 974 474 1052 354 1052H246C126 1052 48 974 48 842V104C48 68.654 76.654 40 112 40Z"/>
  </g>
  <g id="handle-body">
    <path id="upper-panel" d="M112 40H488C523.346 40 552 68.654 552 104V516H48V104C48 68.654 76.654 40 112 40Z" fill="url(#upper-surface)"/>
    <path id="lower-panel" d="M48 516H552V842C552 974 474 1052 354 1052H246C126 1052 48 974 48 842V516Z" fill="url(#lower-surface)"/>
    <path id="upper-edge-highlight" d="M49 104C49 69.206 77.206 41 112 41H488C522.794 41 551 69.206 551 104" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9"/>
  </g>
  <g id="push-up" aria-label="밀어서 넘기기">
    <path id="up-chevron" d="M240 238L300 180L358 238" stroke="#20324D" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <text id="push-label" x="300" y="364" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="64" font-weight="700" textLength="380" lengthAdjust="spacingAndGlyphs" fill="#20324D">밀어서 넘기기</text>
  </g>
  <g id="pull-down" aria-label="당겨서 지원">
    <path id="down-chevron" d="M241 727L300 782L357 727" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <text id="pull-label" x="300" y="898" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="64" font-weight="700" textLength="344" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">당겨서 지원</text>
  </g>
  <g id="center-grip">
    <rect id="grip-shadow-far" x="71" y="482" width="458" height="138" rx="69" fill="#20324D" opacity="0.035"/>
    <rect id="grip-shadow-near" x="71" y="477" width="458" height="138" rx="69" fill="#20324D" opacity="0.055"/>
    <rect id="grip-plate" x="71" y="472" width="458" height="138" rx="69" fill="url(#grip-surface)"/>
    <path id="grip-top-highlight" d="M75 518C84.5 491 110.1 473 140 473H460C489.9 473 515.5 491 525 518" stroke="#FFFFFF" stroke-width="2"/>
    <g id="grip-ridges" fill="#20324D">
      <rect x="248" y="502" width="104" height="20" rx="10"/>
      <rect x="248" y="533" width="104" height="20" rx="10"/>
      <rect x="248" y="564" width="104" height="20" rx="10"/>
    </g>
  </g>
</svg>
